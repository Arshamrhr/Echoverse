version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: anime_redis
    restart: always

  db:
    image: postgres:15-alpine
    container_name: anime_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend: 
    build: ./backend
    container_name: anime_backend
    restart: always
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db

  frontend:
    build: ./frontend
    container_name: anime_frontend
    restart: always
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
  proxy:
    image: nginx:alpine
    container_name: anime_proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/media:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
